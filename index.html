<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Base64 Tool</title>
  <style>
    :root {
      --blue: #0d6efd;
      --blue-dark: #0b5ed7;
      --blue-light: #eaf4ff;
      --dark: #0a2540;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0a2540, #0d6efd, #00b4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: min(780px, 100%);
      background: #fff;
      color: var(--dark);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .header {
      background: linear-gradient(135deg, var(--blue), #00b4ff);
      color: white;
      padding: 26px 24px;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }

    h1 {
      margin: 12px 0 6px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: 0.92;
    }

    .content {
      padding: 24px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border: 2px solid #cfe2ff;
      border-radius: 16px;
      padding: 14px;
      font-size: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
      transition: 0.2s;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--blue);
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    button.secondary {
      background: var(--blue-light);
      color: var(--blue);
    }

    button.danger {
      background: #ff4d6d;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--blue);
      min-height: 20px;
    }

    .footer {
      padding: 16px 24px;
      background: #f5f9ff;
      color: #5c6b7a;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="badge">@retdik</span>
      <h1>Blue Base64 Tool</h1>
      <p>Mã hóa / giải mã Base64 hoạt động với Unicode.</p>
    </div>

    <div class="content">
      <textarea id="input" placeholder="Nhập văn bản hoặc Base64..."></textarea>

      <div class="buttons">
        <button onclick="encode()">Encode Base64</button>
        <button class="secondary" onclick="decode()">Decode Base64</button>
        <button class="secondary" onclick="copyOutput()">Copy</button>
        <button class="danger" onclick="clearAll()">Xóa</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="footer">
      Made for @retdik • Blue theme
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const status = document.getElementById("status");

    function setStatus(msg, ok = true) {
      status.textContent = msg;
      status.style.color = ok ? "#0d6efd" : "#d90429";
    }

    function encodeBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = "";
      for (const b of bytes) binary += String.fromCharCode(b);
      return btoa(binary);
    }

    function decodeBase64(b64) {
      const binary = atob(b64.trim());
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function encode() {
      try {
        input.value = encodeBase64(input.value);
        setStatus("Đã encode Base64!");
      } catch (e) {
        setStatus("Lỗi encode: " + e.message, false);
      }
    }

    function decode() {
      try {
        input.value = decodeBase64(input.value);
        setStatus("Đã decode Base64!");
      } catch (e) {
        setStatus("Lỗi decode: Base64 không hợp lệ!", false);
      }
    }

    function copyOutput() {
      navigator.clipboard.writeText(input.value)
        .then(() => setStatus("Đã copy!"))
        .catch(() => setStatus("Không copy được, hãy copy thủ công.", false));
    }

    function clearAll() {
      input.value = "";
      setStatus("");
    }
  </script>
</body>
</html>
